 .field .slot{width:calc((100% - 44px)/3);height:var(--card-h);border-radius:16px;border:1px solid #849b8628;background:radial-gradient(ellipse at center,#355a5b22,transparent);flex:0 1 auto}
 .field .unit{flex:0 0 auto;border-radius:12px}
 .field .unitname,.hand .name{font-size:var(--title)}
 .field .fieldEffect,.hand .effect{padding:4px 7px;line-height:1.18}
 .field .dome{inset:0;border-radius:12px}
 .phase{height:30px;padding:0 14px;justify-content:center;gap:28px}.phase span{font-size:13px}.phase button{font-size:12px}
 .handarea{height:calc(var(--card-h) + 26px);min-height:calc(var(--card-h) + 26px);padding:0;position:relative;z-index:4}
 .hand{height:100%;padding:8px 22px 18px;overflow:visible;justify-content:center;gap:0;align-items:flex-start}
 .hand .card{position:relative;margin-left:var(--fan-overlap,-18px);transform:translateY(var(--lift)) rotate(var(--angle));transform-origin:50% 95%;transition:transform .16s ease,box-shadow .16s ease;z-index:var(--z);cursor:pointer;border-radius:12px}
 .hand .card:first-child{margin-left:0}
 .hand .card:hover,.hand .card:focus-visible{transform:translateY(-14px) rotate(0deg);z-index:20;box-shadow:0 12px 24px #0009;outline:1px solid #d5ddb1}
 .rail{display:none}
 .history{position:relative;top:auto;right:auto;width:clamp(290px,23vw,360px);height:100%;grid-template-rows:54% 46%;border:1px solid #73877455;border-radius:10px;background:#102730;overflow:hidden;box-shadow:-8px 0 30px #0002}
 .showhistory .history{display:grid}.closehistory{right:30px;top:65px}
 .events{padding:42px 12px 8px}.event{height:68px;margin-bottom:4px;gap:11px;padding:7px}.event img{width:calc((100% - 42px)/2);height:47px;max-width:139px}.event svg{width:22px}.time{bottom:6px;font-size:9px}
 .detail{padding:18px 16px;gap:18px;justify-content:flex-start}.moment{font-size:12px}
 .duel{gap:10px}.duel .unit{width:calc((100% - 30px)/2);max-width:140px;height:161px;border-radius:18px 18px 9px 9px;overflow:visible}.duel .unit img{height:129px;border-radius:15px 15px 0 0;object-fit:cover}.duel .stats{height:28px;font-size:15px}.duel .unitname{font-size:11px}.duel .fieldEffect{display:none}.duel .dome{inset:-4px;border-radius:40% 40% 15% 15%}.result{font-size:15px}.sub{font-size:12px}
}
@media(min-width:901px) and (max-height:799px){.workspace{overflow-y:auto;align-items:flex-start}.arena{height:736px;min-height:736px}.history{height:736px}}
@media(min-width:901px) and (max-height:820px){.detail{gap:12px;padding-top:12px}.duel .unit{height:132px}.duel .unit img{height:100px}.result{font-size:13px}.sub{font-size:11px}}
</style><body><div class="game"><div class="safePreview"><span class="clock">9:41</span><div class="island"></div><span class="signal">▮▮▮ ▰</span></div><div class="homeIndicator"></div><nav class="top"><div class="brand">FOOD CHAIN</div><div class="tools"><button id="historyToggle"></button><button id="menu"></button></div></nav><div class="workspace"><main class="arena"><div class="player"><div class="identity"><span class="avatar" aria-label="Mammal">🐻</span><b>Rival</b><span class="deck" id="rdeck"></span></div><div class="backs"><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i></div><span class="life" id="rlife"></span></div><div class="field" id="enemy"></div><div class="phase"><span><i class="dot"></i>Your turn · Main 1</span><button>Next: Main 2 →</button></div><div class="field" id="friendly"></div><div class="player"><div class="identity"><span class="avatar" aria-label="Fish">🐟</span><b>You</b><span class="deck" id="ydeck"></span></div><button class="pilesButton" aria-label="Open Carrion and Exile"></button><span class="life" id="ylife"></span></div><div class="handarea"><div class="hand" id="hand"></div></div></main><div class="rail" id="rail"></div><aside class="history"><div class="events" id="events"></div><div class="detail" id="detail"></div></aside></div><button class="closehistory" aria-label="Close history">✕</button><div class="piles"><section class="pileBox" role="dialog" aria-label="Carrion and Exile"><div class="pileHead"><button class="active" data-pile="carrion">Carrion · 2</button><button data-pile="exile">Exile · 0</button><button class="closePiles" aria-label="Close">✕</button></div><div class="owners"><button class="active" data-owner="you">You</button><button data-owner="rival">Rival</button></div><div class="pileCards"></div></section></div><div class="inspect"><div id="large"></div><span class="holdhint">Release to return</span></div></div><script>
const root='../../images/cards/';
const paths={attack:'M4 3l13 13M3 3l1 5 4-4-5-1M13 15l3-3M15 17l2-2M4 17L17 4M3 17l5-1-4-4-1 5M13 5l3 3',health:'M10 17S2 12 2 6a4 4 0 018-1 4 4 0 018 1c0 6-8 11-8 11Z',nut:'M4 16C1 5 10 2 17 2c1 8-3 14-11 13M4 18l9-11',shield:'M10 2l7 3v6c0 4-7 7-7 7s-7-3-7-7V5l7-3Z',history:'M3 5a8 8 0 111 12M3 1v5h5M10 6v5l3 2',deck:'M4 5h11v13H4zM7 2h11v13',carrion:'M4 5l12 12M3 3a2 2 0 10-1 4l11 11a2 2 0 103-3L5 4a2 2 0 00-2-1',exile:'M10 2l8 8-8 8-8-8 8-8ZM7 7l6 6M13 7l-6 6',menu:'M3 5h14M3 10h14M3 15h14',arrow:'M2 10h15M12 5l5 5-5 5'};const icon=k=>`<svg viewBox="0 0 20 20"><path d="${paths[k]}"></path></svg>`;
const cards=[{name:'Tiger Shark',id:'fish-predator-tiger-shark',atk:4,hp:4,type:'Predator',text:'<b>Consume:</b> copy the abilities of a Predator in Carrion.'},{name:'Electric Eel',id:'fish-prey-electric-eel',atk:2,hp:2,nut:2,type:'Prey',text:'<b>Before combat:</b> deal 2 damage to a chosen target.'},{name:'Cannibal Fish',id:'fish-prey-cannibal-fish',atk:2,hp:1,nut:2,type:'Prey',text:'<b>On play:</b> choose to summon a 2/2 Lancetfish or gain +2/+2.'},{name:'Shortfin Mako',id:'fish-predator-shortfin-mako',atk:3,hp:3,type:'Predator',text:'<b>Consume:</b> deal 3 damage to a chosen target.'},{name:'Alaskan Moose',id:'mammal-prey-alaskan-moose',atk:3,hp:3,nut:3,type:'Prey',text:'<b>Barrier</b>',barrier:true}];
function stats(c){return `<div class="stats"><span class="stat attack" title="Attack">${icon('attack')}${c.atk}</span>${c.nut!==undefined?`<span class="stat nut" title="Nutrition">${icon('nut')}${c.nut}</span>`:''}<span class="stat health" title="Health">${icon('health')}${c.hp}</span></div>`}
function card(c){return `<div class="card"><div class="name">${c.name}</div><img class="art" src="${root+c.id}.jpg">${stats(c)}<p class="effect">${c.text}</p></div>`}
function unit(c,barrier=c.barrier){return `<div class="unit" data-card="${c.id}"><img src="${root+c.id}.jpg"><div class="unitname">${c.name}</div>${stats(c)}<p class="fieldEffect">${c.text.replace(/<span class="effectTag">.*?<\/span>\s*/, "")}</p>${barrier?`<div class="dome"></div><div class="shield" title="Barrier">${icon('shield')}</div>`:''}</div>`}
const empty='<div class="slot empty"></div>';document.querySelector('#enemy').innerHTML='<div class="slot">'+unit(cards[4])+'</div>'+empty+empty;document.querySelector('#friendly').innerHTML='<div class="slot">'+unit(cards[1])+'</div><div class="slot">'+unit(cards[2])+'</div>'+empty;
const hand=[cards[0],cards[2],cards[3],cards[1],cards[0]];document.querySelector('#hand').innerHTML=hand.map(card).join('');document.querySelector('#large').innerHTML=card(cards[2]);for(const id of ['rlife','ylife'])document.getElementById(id).innerHTML=icon('health')+'10';for(const id of ['rdeck','ydeck'])document.getElementById(id).innerHTML=icon('deck')+'15';for(const [id,ico,label] of [['historyToggle','history','History'],['menu','menu','Menu']])document.getElementById(id).innerHTML=icon(ico)+label;
const ev=[{a:3,b:4,action:'attack',turn:3,description:'<strong>Barrier absorbed the hit.</strong><br>Alaskan Moose took no damage.',sub:'Shortfin Mako attacked Alaskan Moose.',barrier:true},{a:1,b:4,action:'arrow',turn:2,description:'<strong>2 damage dealt.</strong>',sub:'Electric Eel targeted Alaskan Moose.',barrier:false},{a:2,b:2,action:'nut',turn:2,description:'<strong>+2 Attack · +2 Health</strong>',sub:'Cannibal Fish chose to grow stronger.',barrier:false},{a:4,b:4,action:'arrow',turn:1,description:'Alaskan Moose entered the field.',sub:'Barrier active.',barrier:true}];
function row(e,i){return `<button class="event ${i===0?'selected':''}" data-i="${i%4}" aria-label="${e.sub}"><img src="${root+cards[e.a].id}.jpg">${icon(e.action)}<img src="${root+cards[e.b].id}.jpg"><span class="time">T${e.turn}</span></button>`}
document.querySelector('#events').innerHTML=[...ev,...ev].map((e,i)=>row(e,i)).join('');document.querySelector('#rail').innerHTML=ev.map(row).join('');function detail(i){let e=ev[i];document.querySelector('#detail').innerHTML=`<div class="moment">Turn ${e.turn}</div><div class="duel">${unit(cards[e.a],false)}${icon(e.action)}${unit(cards[e.b],e.barrier)}</div><p class="result">${e.description}</p><p class="sub">${e.sub}</p>`}detail(0);
function toggle(){document.body.classList.toggle('showhistory')}document.querySelector('#historyToggle').onclick=toggle;document.querySelector('.closehistory').onclick=toggle;document.querySelectorAll('.event').forEach(el=>el.onclick=()=>{document.body.classList.add('showhistory');document.querySelectorAll('.event').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');detail(+el.dataset.i)});
let timer;document.querySelectorAll('#hand .card').forEach((el,i)=>{el.addEventListener('pointerdown',()=>{timer=setTimeout(()=>{document.querySelector('#large').innerHTML=card(hand[i]);document.body.classList.add('holding')},350)});el.addEventListener('pointermove',e=>{if(Math.abs(e.movementX)+Math.abs(e.movementY)>5)clearTimeout(timer)})});for(const event of ['pointerup','pointercancel'])window.addEventListener(event,()=>{clearTimeout(timer);document.body.classList.remove('holding')});document.querySelectorAll('.events .event').forEach(el=>el.addEventListener('pointerenter',()=>{if(matchMedia('(min-width:601px)').matches){document.querySelectorAll('.event').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');detail(+el.dataset.i)}}));document.querySelectorAll('.field .unit').forEach(el=>el.addEventListener('pointerdown',()=>{timer=setTimeout(()=>{document.querySelector('#large').innerHTML=card(cards.find(c=>c.id===el.dataset.card));document.body.classList.add('holding')},350)}));if(location.search.includes('history'))document.body.classList.add('showhistory');if(location.search.includes('hold'))document.body.classList.add('holding');

document.querySelector('.pilesButton').innerHTML='<span>'+icon('carrion')+'2</span><span>'+icon('exile')+'0</span>';
let pile='carrion',owner='you';function renderPile(){document.querySelector('.pileCards').innerHTML=pile==='carrion'&&owner==='you'?[cards[3],cards[1]].map(card).join(''):'<p class="emptyPile">No cards here</p>';document.querySelector('[data-pile="carrion"]').textContent='Carrion · '+(owner==='you'?2:0)}renderPile();
document.querySelector('.pilesButton').onclick=()=>document.body.classList.add('showpiles');document.querySelector('.closePiles').onclick=()=>document.body.classList.remove('showpiles');document.querySelectorAll('[data-pile]').forEach(el=>el.onclick=()=>{pile=el.dataset.pile;document.querySelectorAll('[data-pile]').forEach(b=>b.classList.toggle('active',b===el));renderPile()});document.querySelectorAll('[data-owner]').forEach(el=>el.onclick=()=>{owner=el.dataset.owner;document.querySelectorAll('[data-owner]').forEach(b=>b.classList.toggle('active',b===el));renderPile()});
const vv=new URLSearchParams(location.search).get('v');if(vv)document.body.dataset.v=vv;if(location.search.includes('island'))document.body.classList.add('islandPreview');if(location.search.includes('piles'))document.body.classList.add('showpiles');
let downX=0,downY=0;document.querySelector('#hand').addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY});document.querySelector('#hand').addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-downX,e.clientY-downY)>8){clearTimeout(timer);document.body.classList.remove('holding')}});document.querySelector('#hand').addEventListener('scroll',()=>{clearTimeout(timer);document.body.classList.remove('holding')});

// Derive geometry once for both zones; source image dimensions cannot change it.
function sizeBattleCards(){
 const arena=document.querySelector('.arena');
 if(innerWidth>900){
  const g=document.querySelector('.game');
  const font=Math.max(11,Math.min(16,(innerHeight-900)/100+12));
  const name=font+8,stats=font+10,effect=font*1.18*3+10;
  const budget=(arena.clientHeight-132)/3;
  const w=Math.floor(Math.min(288,(arena.clientWidth-100)/3,(budget-name-stats-effect-4)*1.4+4));
  const art=(w-4)/1.4,h=name+art+stats+effect+4;
  for(const [key,value] of Object.entries({'cw':w,'art-h':art,'card-h':h,'name-h':name,'stat-h':stats,'copy':font,'title':font}))g.style.setProperty('--'+key,value+'px');
  const overlap=Math.min(8,(arena.clientWidth-90-w*5)/4);
  g.style.setProperty('--fan-overlap',overlap+'px');
  return;
 }
 const fitHeight=innerWidth>600?Math.floor((arena.clientHeight-166)*119/(3*185)):180;
 const w=Math.min(180,fitHeight,Math.floor((arena.clientWidth-16)/3));
 const k=w/119, g=document.querySelector('.game');
 for(const [key,value] of Object.entries({'cw':w,'art-h':(w-4)/1.4,'card-h':185*k,'name-h':20*k,'stat-h':23*k,'copy':10.5*k,'title':10.5*k}))g.style.setProperty('--'+key,value+'px');
}
for(const [i,e] of [...document.querySelectorAll('.hand .card')].entries()){
 e.style.setProperty('--angle',(i-2)*2+'deg');e.style.setProperty('--lift',Math.abs(i-2)*4+'px');e.style.setProperty('--z',i+1);e.tabIndex=0;
}
for(const [id,label] of [['carrion','Carrion · 2'],['exile','Exile · 0']]){
 const el=document.createElement('button');el.className='desktopPile';el.innerHTML=icon(id)+label;
 el.onclick=()=>{pile=id;renderPile();document.querySelectorAll('[data-pile]').forEach(b=>b.classList.toggle('active',b.dataset.pile===id));document.body.classList.add('showpiles')};
 document.querySelector('#menu').before(el);
}
if(innerWidth>900)document.body.classList.add('showhistory');
new ResizeObserver(sizeBattleCards).observe(document.querySelector('.arena'));sizeBattleCards();
</script></body></html>
