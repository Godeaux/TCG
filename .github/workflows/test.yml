name: Test & Lint

on:
  push:
    branches: [main, master, 'stabilize/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release candidate
        run: npm run check
      - name: Install managed Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify production UI
        run: npm run test:ui
      - name: Verify Safari collection geometry
        run: TCG_BROWSER=webkit node e2e/mobile-collection.mjs
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-overhaul-evidence
          path: |
            docs/ui-overhaul/evidence/acceptance/
            docs/ui-overhaul/evidence/mobile-feedback/
            docs/ui-overhaul/evidence/spell-presentation/
            docs/dust-crafting/
